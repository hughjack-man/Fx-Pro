<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fx Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <i class="fas fa-coins"></i>
          </div>
          <h1>Fx Pro </h1>
          <p>Sign in to your Fx Pro account</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div style="position: relative;">
              <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
              <input type="email" class="form-input" id="email" placeholder="Enter your email" required style="padding-left: 2.75rem; " >
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Password</label>
            <div style="position: relative;">
              <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
              <input type="password" class="form-input" id="password" placeholder="Enter your password" required style="padding-left: 2.75rem;">
              <button type="button" id="togglePassword" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); padding: 10px; background: none; border: none; color: #64748b; cursor: pointer;">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="remember" style="width: 20px; height: 20px;">
              <span style="font-size: 0.875rem; color: #94a3b8;">Remember me</span>
            </label>
            <a href="#" style="font-size: 0.875rem; color: #818cf8;">Forgot password?</a>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i>
            <span>Sign In</span>
          </button>
        </form>
        
        <div class="auth-footer">
          Don't have an account? <a href="register.html">Create one</a>
        </div>
        
        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="../index.html" style="color: #64748b; font-size: 0.875rem;">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Check if already logged in
    (function() {
      try {
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        
        if (token && userStr) {
          const user = JSON.parse(userStr);
          if (user.role === 'admin') {
            window.location.href = '../admin/dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }
      } catch (e) {
        console.error('Auth check error:', e);
        // Clear invalid data
        localStorage.removeItem('token');
        localStorage.removeItem('user');
      }
    })();

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Handle login form
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const alertContainer = document.getElementById('alertContainer');
      
      // Validate inputs
      if (!email || !password) {
        showError('Please enter both email and password');
        return;
      }
      
      // Clear previous alerts
      alertContainer.innerHTML = '';
      
      // Show loading
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; border-width: 2px;"></div> Signing in...';
      
      try {
        console.log('Attempting login with:', { email }); // Debug log
        
        // Make direct fetch call for better error handling
        // const API_BASE_URL = window.location.port === '5000' || window.location.port === '' 
        //   ? `${window.location.origin}/api` 
        //   : 'https://fxpro-backend.onrender.com/api';
        // REPLACE THIS SECTION:
// const API_BASE_URL = window.location.port === '5000' || window.location.port === '' 
//   ? `${window.location.origin}/api` 
//   : 'https://fxpro-backend.onrender.com/api';

// WITH THIS:
const API_BASE_URL = 'https://fx-pro-backend.onrender.com/api';
          
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        console.log('Response status:', response.status);
        
        // Get response text
        const responseText = await response.text();
        console.log('Response text:', responseText);
        
        // Try to parse JSON
        let data;
        try {
          data = JSON.parse(responseText);
        } catch (e) {
          throw new Error('Server returned invalid response. Please make sure the backend is running on port 5000.');
        }
        
        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Login failed');
        }
        
        // Store token and user
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // Show success message
        showSuccess('Login successful! Redirecting...');
        
        // Redirect based on role
        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = '../admin/dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 2000);
        
      } catch (error) {
        console.error('Login error:', error);
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
        showError(error.message || 'An error occurred. Please try again.');
      }
    });
    
    function showError(message) {
      const alertContainer = document.getElementById('alertContainer');
      const alertDiv = document.createElement('div');
      alertDiv.className = 'alert alert-danger fade-in';
      alertDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i><span>${message}</span>`;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alertDiv);
    }
    
    function showSuccess(message) {
      const alertContainer = document.getElementById('alertContainer');
      const alertDiv = document.createElement('div');
      alertDiv.className = 'alert alert-success fade-in';
      alertDiv.innerHTML = `<i class="fas fa-check-circle"></i><span>${message}</span>`;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alertDiv);
    }
  </script>

</html>
