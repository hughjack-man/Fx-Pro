<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <title>Investment Plans - Fx Pro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-coins"></i></div>
        <span class="sidebar-brand">Fx Pro Admin</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Admin</div>
          <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
          <a href="users.html" class="nav-item"><i class="fas fa-users"></i><span>Users</span></a>
          <a href="deposits.html" class="nav-item"><i class="fas fa-arrow-down"></i><span>Deposits</span></a>
          <a href="withdrawals.html" class="nav-item"><i class="fas fa-arrow-up"></i><span>Withdrawals</span></a>
          <a href="investments.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Investments</span></a>
          <a href="investment-plans.html" class="nav-item active"><i class="fas fa-gem"></i><span>Plans</span></a>
          <a href="loans.html" class="nav-item"><i class="fas fa-hand-holding-usd"></i><span>Loans</span></a>
          <a href="kyc.html" class="nav-item"><i class="fas fa-id-card"></i><span>KYC</span></a>
          <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i><span>Messages</span></a>
          <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
          <a href="logs.html" class="nav-item"><i class="fas fa-history"></i><span>Logs</span></a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">Investment Plans</h1>
        </div>
        <div class="header-right">
          <!-- <button class="header-btn" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></button> -->
          <div class="user-menu">
            <div class="user-avatar">A</div>
            <div class="user-info">
              <div class="user-name">Admin</div>
              <div class="user-role">Administrator</div>
            </div>
          </div>
        </div>
      </header>

      <div class="content">
        <div id="alertContainer"></div>
        
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Create New Plan</h3>
          </div>
          <div class="card-body">
            <form id="planForm">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div class="form-group">
                  <label class="form-label">Plan Name</label>
                  <input type="text" class="form-input" id="planName" placeholder="e.g., Gold Plan" required>
                </div>
                <div class="form-group">
                  <label class="form-label">ROI (%)</label>
                  <input type="number" class="form-input" id="planROI" placeholder="e.g., 15" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Duration (Days)</label>
                  <input type="number" class="form-input" id="planDuration" placeholder="e.g., 30" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Min Amount ($)</label>
                  <input type="number" class="form-input" id="planMin" placeholder="e.g., 100" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Max Amount ($)</label>
                  <input type="number" class="form-input" id="planMax" placeholder="e.g., 10000" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-textarea" id="planDesc" placeholder="Plan description..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary" id="createBtn">
                <i class="fas fa-plus"></i><span>Create Plan</span>
              </button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">All Plans</h3>
          </div>
          <div class="card-body">
            <div id="plansList"><div class="loading"><div class="spinner"></div></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Edit Plan</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editPlanId">
          <div class="form-group">
            <label class="form-label">Plan Name</label>
            <input type="text" class="form-input" id="editName">
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
            <div class="form-group">
              <label class="form-label">ROI (%)</label>
              <input type="number" class="form-input" id="editROI">
            </div>
            <div class="form-group">
              <label class="form-label">Duration (Days)</label>
              <input type="number" class="form-input" id="editDuration">
            </div>
            <div class="form-group">
              <label class="form-label">Min Amount ($)</label>
              <input type="number" class="form-input" id="editMin">
            </div>
            <div class="form-group">
              <label class="form-label">Max Amount ($)</label>
              <input type="number" class="form-input" id="editMax">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" id="editDesc"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-select" id="editStatus">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="savePlan()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notification.js"></script>
  <script>
    if (!API.utils.isAuthenticated() || !API.utils.isAdmin()) {
      window.location.href = '../user/login.html';
    }

    // Menu toggle for mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (window.innerWidth <= 1024) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);

    // Close sidebar on window resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 1024) {
        closeSidebar();
      }
    });

    async function loadPlans() {
      try {
        const data = await API.investmentPlan.getAllAdmin();
        const container = document.getElementById('plansList');
        
        if (!data.plans || data.plans.length === 0) {
          container.innerHTML = `<div class="empty-state"><p>No plans created yet</p></div>`;
          return;
        }
        
        container.innerHTML = `
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>ROI</th>
                  <th>Duration</th>
                  <th>Min/Max</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.plans.map(p => `
                  <tr>
                    <td>${p.name}</td>
                    <td>${p.ROI}%</td>
                    <td>${p.durationDays} days</td>
                    <td>$${p.minAmount.toLocaleString()} - $${p.maxAmount.toLocaleString()}</td>
                    <td><span class="badge badge-${p.isActive ? 'success' : 'secondary'}">${p.isActive ? 'Active' : 'Inactive'}</span></td>
                    <td>
                      <button class="btn btn-sm btn-primary" onclick="editPlan('${p._id}', '${p.name}', ${p.ROI}, ${p.durationDays}, ${p.minAmount}, ${p.maxAmount}, '${p.description || ''}', ${p.isActive})">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-danger" onclick="deletePlan('${p._id}')">
                        <i class="fas fa-trash"></i>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (error) {
        console.error('Error:', error);
      }
    }

    document.getElementById('planForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('createBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></div>';
      
      try {
        await API.investmentPlan.create({
          name: document.getElementById('planName').value,
          ROI: parseFloat(document.getElementById('planROI').value),
          durationDays: parseInt(document.getElementById('planDuration').value),
          minAmount: parseFloat(document.getElementById('planMin').value),
          maxAmount: parseFloat(document.getElementById('planMax').value),
          description: document.getElementById('planDesc').value
        });
        
        API.utils.showAlert('Plan created successfully', 'success');
        document.getElementById('planForm').reset();
        loadPlans();
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-plus"></i><span>Create Plan</span>';
      }
    });

    function editPlan(id, name, roi, duration, min, max, desc, isActive) {
      document.getElementById('editPlanId').value = id;
      document.getElementById('editName').value = name;
      document.getElementById('editROI').value = roi;
      document.getElementById('editDuration').value = duration;
      document.getElementById('editMin').value = min;
      document.getElementById('editMax').value = max;
      document.getElementById('editDesc').value = desc;
      document.getElementById('editStatus').value = isActive.toString();
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function savePlan() {
      try {
        const id = document.getElementById('editPlanId').value;
        await API.investmentPlan.update(id, {
          name: document.getElementById('editName').value,
          ROI: parseFloat(document.getElementById('editROI').value),
          durationDays: parseInt(document.getElementById('editDuration').value),
          minAmount: parseFloat(document.getElementById('editMin').value),
          maxAmount: parseFloat(document.getElementById('editMax').value),
          description: document.getElementById('editDesc').value,
          isActive: document.getElementById('editStatus').value === 'true'
        });
        
        API.utils.showAlert('Plan updated successfully', 'success');
        closeModal();
        loadPlans();
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    async function deletePlan(id) {
      if (!confirm('Are you sure you want to delete this plan?')) return;
      
      try {
        await API.investmentPlan.delete(id);
        API.utils.showAlert('Plan deleted successfully', 'success');
        loadPlans();
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    loadPlans();
  </script>
</body>
</html>
