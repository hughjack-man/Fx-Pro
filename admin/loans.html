<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.7">
  <title>Loans - Coinnex Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-coins"></i></div>
        <span class="sidebar-brand">Coinnex Admin</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Admin</div>
          <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
          <a href="users.html" class="nav-item"><i class="fas fa-users"></i><span>Users</span></a>
          <a href="deposits.html" class="nav-item"><i class="fas fa-arrow-down"></i><span>Deposits</span></a>
          <a href="withdrawals.html" class="nav-item"><i class="fas fa-arrow-up"></i><span>Withdrawals</span></a>
          <a href="investments.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Investments</span></a>
          <a href="investment-plans.html" class="nav-item"><i class="fas fa-gem"></i><span>Plans</span></a>
          <a href="loans.html" class="nav-item active"><i class="fas fa-hand-holding-usd"></i><span>Loans</span></a>
          <a href="kyc.html" class="nav-item"><i class="fas fa-id-card"></i><span>KYC</span></a>
          <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i><span>Messages</span></a>
          <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
          <a href="logs.html" class="nav-item"><i class="fas fa-history"></i><span>Logs</span></a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">Loan Management</h1>
        </div>
        <div class="header-right">
          <!-- <button class="header-btn" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></button> -->
          <div class="user-menu">
            <div class="user-avatar">A</div>
            <div class="user-info">
              <div class="user-name">Admin</div>
              <div class="user-role">Administrator</div>
            </div>
          </div>
        </div>
      </header>

      <div class="content">
        <div id="alertContainer"></div>
        
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Create Loan Plan</h3>
          </div>
          <div class="card-body">
            <form id="planForm">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div class="form-group">
                  <label class="form-label">Plan Name</label>
                  <input type="text" class="form-input" id="planName" placeholder="e.g., Personal Loan" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Interest Rate (%)</label>
                  <input type="number" class="form-input" id="planInterest" placeholder="e.g., 10" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Duration (Months)</label>
                  <input type="number" class="form-input" id="planDuration" placeholder="e.g., 12" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Max Amount ($)</label>
                  <input type="number" class="form-input" id="planMax" placeholder="e.g., 50000" required>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" id="createBtn">
                <i class="fas fa-plus"></i><span>Create Plan</span>
              </button>
            </form>
          </div>
        </div>

        <div class="card" style="width: 36.2rem;">
          <div class="card-header">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
              <select class="form-select" id="statusFilter" style="width: 150px;" onchange="loadLoans()">
                <option value="">All Status</option>
                <option value="pending" selected>Pending</option>
                <option value="approved">Approved</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
                <option value="declined">Declined</option>
              </select>
              <button class="btn btn-primary" onclick="loadLoans()">
                <i class="fas fa-sync"></i><span>Refresh</span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <div id="loansList"><div class="loading"><div class="spinner"></div></div></div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Decline Modal -->
  <div class="modal-overlay" id="declineModal" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Decline Loan</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="declineLoanId">
        <div class="form-group">
          <label class="form-label">Reason (Optional)</label>
          <textarea class="form-textarea" id="declineReason" placeholder="Enter reason for declining..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDecline()">Decline Loan</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notification.js"></script>
  <script>
    if (!API.utils.isAuthenticated() || !API.utils.isAdmin()) {
      window.location.href = '../user/login.html';
    }

    // Menu toggle for mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (window.innerWidth <= 1024) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);

    // Close sidebar on window resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 1024) {
        closeSidebar();
      }
    });

    document.getElementById('planForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('createBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></div>';
      
      try {
        await API.loan.createPlan({
          name: document.getElementById('planName').value,
          interestRate: parseFloat(document.getElementById('planInterest').value),
          durationMonths: parseInt(document.getElementById('planDuration').value),
          maxAmount: parseFloat(document.getElementById('planMax').value)
        });
        
        API.utils.showAlert('Loan plan created successfully', 'success');
        document.getElementById('planForm').reset();
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-plus"></i><span>Create Plan</span>';
      }
    });

    async function loadLoans(page = 1) {
      try {
        const status = document.getElementById('statusFilter').value;
        const data = await API.loan.getAll(status, page, 20);
        
        const container = document.getElementById('loansList');
        if (!data.loans || data.loans.length === 0) {
          container.innerHTML = `<div class="empty-state"><p>No loans found</p></div>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }
        
        container.innerHTML = `
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Plan</th>
                  <th>Amount</th>
                  <th>Interest</th>
                  <th>Monthly</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.loans.map(l => `
                  <tr>
                    <td>${l.userId?.name || 'User'}</td>
                    <td>${l.planId?.name || 'Plan'}</td>
                    <td>${API.utils.formatCurrency(l.amount)}</td>
                    <td>${l.interestRate}%</td>
                    <td>${API.utils.formatCurrency(l.monthlyPayment)}</td>
                    <td><span class="badge badge-${l.status === 'active' || l.status === 'approved' ? 'success' : l.status === 'pending' ? 'warning' : 'danger'}">${l.status}</span></td>
                    <td>${API.utils.formatDate(l.createdAt)}</td>
                    <td>
                      ${l.status === 'pending' ? `
                        <button class="btn btn-sm btn-success" onclick="approveLoan('${l._id}')">
                          <i class="fas fa-check"></i> Approve
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="openDeclineModal('${l._id}')">
                          <i class="fas fa-times"></i> Decline
                        </button>
                      ` : '<span>-</span>'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
        
        const pagination = document.getElementById('pagination');
        if (data.pagination.pages > 1) {
          let html = `<button class="pagination-btn" ${page === 1 ? 'disabled' : ''} onclick="loadLoans(${page - 1})"><i class="fas fa-chevron-left"></i></button>`;
          for (let i = 1; i <= data.pagination.pages; i++) {
            html += `<button class="pagination-btn ${i === page ? 'active' : ''}" onclick="loadLoans(${i})">${i}</button>`;
          }
          html += `<button class="pagination-btn" ${page === data.pagination.pages ? 'disabled' : ''} onclick="loadLoans(${page + 1})"><i class="fas fa-chevron-right"></i></button>`;
          pagination.innerHTML = html;
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    async function approveLoan(id) {
      if (!confirm('Are you sure you want to approve this loan?')) return;
      
      try {
        await API.loan.approve(id);
        API.utils.showAlert('Loan approved successfully', 'success');
        loadLoans();
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    function openDeclineModal(id) {
      document.getElementById('declineLoanId').value = id;
      document.getElementById('declineModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('declineModal').style.display = 'none';
      document.getElementById('declineReason').value = '';
    }

    async function confirmDecline() {
      const id = document.getElementById('declineLoanId').value;
      const reason = document.getElementById('declineReason').value;
      
      try {
        await API.loan.decline(id, reason);
        API.utils.showAlert('Loan declined', 'success');
        closeModal();
        loadLoans();
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    loadLoans();
  </script>
</body>
</html>
