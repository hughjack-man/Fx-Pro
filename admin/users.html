<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.9">
  <title>Users - Fx Pro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-coins"></i></div>
        <span class="sidebar-brand">Fx Pro Admin</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Admin</div>
          <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
          <a href="users.html" class="nav-item active"><i class="fas fa-users"></i><span>Users</span></a>
          <a href="deposits.html" class="nav-item"><i class="fas fa-arrow-down"></i><span>Deposits</span></a>
          <a href="withdrawals.html" class="nav-item"><i class="fas fa-arrow-up"></i><span>Withdrawals</span></a>
          <a href="investments.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Investments</span></a>
          <a href="investment-plans.html" class="nav-item"><i class="fas fa-gem"></i><span>Plans</span></a>
          <a href="loans.html" class="nav-item"><i class="fas fa-hand-holding-usd"></i><span>Loans</span></a>
          <a href="kyc.html" class="nav-item"><i class="fas fa-id-card"></i><span>KYC</span></a>
          <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i><span>Messages</span></a>
          <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
          <a href="logs.html" class="nav-item"><i class="fas fa-history"></i><span>Logs</span></a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">Manage Users</h1>
        </div>
        <div class="header-right">
          <!-- <button class="header-btn" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></button> -->
          <div class="user-menu">
            <div class="user-avatar">A</div>
            <div class="user-info">
              <div class="user-name">Admin</div>
              <div class="user-role">Administrator</div>
            </div>
          </div>
        </div>
      </header>

      <div class="content">
        <div id="alertContainer"></div>
        
        <div class="card" style="width: 28rem;">
          <div class="card-header">
            <div style="display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;">
              <input type="text" class="form-input" id="searchInput" placeholder="Search users..." style="width: 60%;">
              <select class="form-select" id="kycFilter" style="width: 150px;">
                <option value="">All KYC</option>
                <option value="verified">Verified</option>
                <option value="pending">Pending</option>
                <option value="rejected">Rejected</option>
                <option value="not_submitted">Not Submitted</option>
              </select>
              <button class="btn btn-primary" onclick="loadUsers()">
                <i class="fas fa-search"></i><span>Search</span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <div id="usersList"><div class="loading"><div class="spinner"></div></div></div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit User Modal -->
  <div class="modal-overlay" id="editModal" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Edit User</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editUserId">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" class="form-input" id="editName">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="editEmail" readonly style="background: rgba(100, 116, 139, 0.1);">
          </div>
          <div class="form-group">
            <label class="form-label">Balance (USD)</label>
            <input type="number" class="form-input" id="editBalance">
          </div>
          <div class="form-group">
            <label class="form-label">KYC Status</label>
            <select class="form-select" id="editKycStatus">
              <option value="not_submitted">Not Submitted</option>
              <option value="pending">Pending</option>
              <option value="verified">Verified</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Account Status</label>
            <select class="form-select" id="editStatus">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notification.js"></script>
  <script>
    if (!API.utils.isAuthenticated() || !API.utils.isAdmin()) {
      window.location.href = '../user/login.html';
    }

    // Menu toggle for mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (window.innerWidth <= 1024) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);

    // Close sidebar on window resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 1024) {
        closeSidebar();
      }
    });

    let currentPage = 1;
    let currentUser = null;

    async function loadUsers(page = 1) {
      try {
        const search = document.getElementById('searchInput').value;
        const kycStatus = document.getElementById('kycFilter').value;
        const data = await API.admin.getUsers(search, kycStatus, page, 20);
        
        const container = document.getElementById('usersList');
        if (!data.users || data.users.length === 0) {
          container.innerHTML = `<div class="empty-state"><p>No users found</p></div>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }
        
        container.innerHTML = `
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Balance</th>
                  <th>KYC</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.users.map(u => `
                  <tr>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${API.utils.formatCurrency(u.balanceUSD)}</td>
                    <td><span class="badge badge-${u.kycStatus === 'verified' ? 'success' : u.kycStatus === 'pending' ? 'warning' : 'secondary'}">${u.kycStatus}</span></td>
                    <td><span class="badge badge-${u.isActive ? 'success' : 'danger'}">${u.isActive ? 'Active' : 'Inactive'}</span></td>
                    <td>${API.utils.formatDate(u.createdAt)}</td>
                    <td>
                      <button class="btn btn-sm btn-primary" onclick="editUser('${u._id}')">
                        <i class="fas fa-edit"></i>
                      </button>
                      <button class="btn btn-sm btn-danger" onclick="deleteUser('${u._id}')">
                        <i class="fas fa-trash"></i>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
        
        // Pagination
        const pagination = document.getElementById('pagination');
        if (data.pagination.pages > 1) {
          let html = `<button class="pagination-btn" ${page === 1 ? 'disabled' : ''} onclick="loadUsers(${page - 1})"><i class="fas fa-chevron-left"></i></button>`;
          for (let i = 1; i <= data.pagination.pages; i++) {
            html += `<button class="pagination-btn ${i === page ? 'active' : ''}" onclick="loadUsers(${i})">${i}</button>`;
          }
          html += `<button class="pagination-btn" ${page === data.pagination.pages ? 'disabled' : ''} onclick="loadUsers(${page + 1})"><i class="fas fa-chevron-right"></i></button>`;
          pagination.innerHTML = html;
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    async function editUser(id) {
      try {
        const data = await API.admin.getUser(id);
        currentUser = data.user;
        
        document.getElementById('editUserId').value = data.user._id;
        document.getElementById('editName').value = data.user.name;
        document.getElementById('editEmail').value = data.user.email;
        document.getElementById('editBalance').value = data.user.balanceUSD;
        document.getElementById('editKycStatus').value = data.user.kycStatus;
        document.getElementById('editStatus').value = data.user.isActive.toString();
        
        document.getElementById('editModal').style.display = 'flex';
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
      currentUser = null;
    }

    async function saveUser() {
      try {
        const id = document.getElementById('editUserId').value;
        const data = {
          name: document.getElementById('editName').value,
          balanceUSD: parseFloat(document.getElementById('editBalance').value),
          kycStatus: document.getElementById('editKycStatus').value,
          isActive: document.getElementById('editStatus').value === 'true'
        };
        
        await API.admin.updateUser(id, data);
        API.utils.showAlert('User updated successfully', 'success');
        closeModal();
        loadUsers(currentPage);
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    async function deleteUser(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      
      try {
        await API.admin.deleteUser(id);
        API.utils.showAlert('User deleted successfully', 'success');
        loadUsers(currentPage);
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    loadUsers();
  </script>
</body>
</html>
