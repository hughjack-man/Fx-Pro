<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Fx Pro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .conversation-item {
      padding: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .conversation-item:hover {
      background: rgba(255,255,255,0.03);
    }
    .conversation-item.active {
      border-left: 3px solid var(--primary);
      background: rgba(99, 102, 241, 0.1);
    }
    .conversation-item.unread {
      background: rgba(99, 102, 241, 0.05);
    }
    .conversation-item.unread .conversation-name {
      font-weight: 700;
      color: white;
    }
    .conversation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .conversation-name {
      font-weight: 600;
      color: #e2e8f0;
    }
    .conversation-time {
      font-size: 0.7rem;
      color: var(--gray);
    }
    .conversation-preview {
      font-size: 0.8rem;
      color: var(--gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conversation-badge {
      background: var(--danger);
      color: white;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-weight: 600;
    }
    .new-chat-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .new-chat-btn:hover {
      background: var(--primary-dark);
    }
    .user-search-item {
      padding: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.2s ease;
    }
    .user-search-item:hover {
      background: rgba(99, 102, 241, 0.1);
    }
    .user-search-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .user-search-info {
      flex: 1;
    }
    .user-search-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .user-search-email {
      font-size: 0.8rem;
      color: var(--gray);
    }
    .user-search-unread {
      background: var(--danger);
      color: white;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 10px;
      font-weight: 600;
    }
    .search-input-wrapper {
      position: relative;
      margin-bottom: 1rem;
    }
    .search-input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }
    .search-input-wrapper input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 0.9rem;
    }
    .search-input-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      color: var(--gray);
    }
    .typing-indicator span {
      animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-coins"></i></div>
        <span class="sidebar-brand">Fx Pro Admin</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Admin</div>
          <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
          <a href="users.html" class="nav-item"><i class="fas fa-users"></i><span>Users</span></a>
          <a href="deposits.html" class="nav-item"><i class="fas fa-arrow-down"></i><span>Deposits</span></a>
          <a href="withdrawals.html" class="nav-item"><i class="fas fa-arrow-up"></i><span>Withdrawals</span></a>
          <a href="investments.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Investments</span></a>
          <a href="investment-plans.html" class="nav-item"><i class="fas fa-gem"></i><span>Plans</span></a>
          <a href="loans.html" class="nav-item"><i class="fas fa-hand-holding-usd"></i><span>Loans</span></a>
          <a href="kyc.html" class="nav-item"><i class="fas fa-id-card"></i><span>KYC</span></a>
          <a href="messages.html" class="nav-item active"><i class="fas fa-envelope"></i><span>Messages</span></a>
          <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
          <a href="logs.html" class="nav-item"><i class="fas fa-history"></i><span>Logs</span></a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">Support Messages</h1>
        </div>
        <div class="header-right">
          <button class="header-btn" id="messageBadgeBtn" title="Unread Messages" style="display: none;">
            <i class="fas fa-envelope"></i>
            <span class="badge" id="totalUnreadBadge">0</span>
          </button>
          <!-- <button class="header-btn" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></button> -->
          <div class="user-menu">
            <div class="user-avatar">A</div>
            <div class="user-info">
              <div class="user-name">Admin</div>
              <div class="user-role">Administrator</div>
            </div>
          </div>
        </div>
      </header>

      <div class="content">
        <div id="alertContainer"></div>
        
        <div style="display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem;">
          <div class="card">
            <div class="card-header" style="padding: 1rem;">
              <button class="new-chat-btn" onclick="openNewChatModal()">
                <i class="fas fa-plus"></i>
                <span>New Chat</span>
              </button>
            </div>
            <div class="card-body" style="padding: 0; max-height: 550px; overflow-y: auto;">
              <div id="conversationsList">
                <div class="loading" style="padding: 2rem;">
                  <div class="spinner" style="width: 30px; height: 30px;"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header" style="display: flex; align-items: center; justify-content: space-between;">
              <h3 class="card-title" id="chatTitle">
                <i class="fas fa-comments" style="color: var(--primary); margin-right: 0.5rem;"></i>
                Select a conversation
              </h3>
              <div id="chatActions" style="display: none;">
                <button class="btn btn-sm btn-secondary" onclick="refreshMessages()">
                  <i class="fas fa-sync-alt"></i>
                </button>
              </div>
            </div>
            <div class="card-body" style="padding: 0;">
              <div class="chat-container" id="chatContainer" style="height: 550px;">
                <div class="chat-messages" id="chatMessages" style="padding: 1.5rem;">
                  <div class="empty-state" style="padding: 4rem 2rem;">
                    <div class="empty-state-icon">
                      <i class="fas fa-comments"></i>
                    </div>
                    <h3>Select a User</h3>
                    <p>Click on a conversation or start a new chat to view messages</p>
                  </div>
                </div>
                <div class="chat-input-container" id="chatInputContainer" style="display: none; padding: 1rem 1.5rem;">
                  <input type="hidden" id="currentUserId">
                  <input type="text" class="chat-input" id="messageInput" placeholder="Type your message...">
                  <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Chat Modal -->
  <div class="modal-overlay" id="newChatModal" style="display: none;">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fas fa-plus-circle" style="color: var(--primary); margin-right: 0.5rem;"></i>Start New Chat</h3>
        <button class="modal-close" onclick="closeNewChatModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="search-input-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="userSearchInput" placeholder="Search users by name or email..." oninput="searchUsers(this.value)">
        </div>
        <div id="userSearchResults" style="max-height: 400px; overflow-y: auto;">
          <div class="loading" style="padding: 2rem;">
            <div class="spinner" style="width: 30px; height: 30px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notification.js"></script>
  <script>
    if (!API.utils.isAuthenticated() || !API.utils.isAdmin()) {
      window.location.href = '../user/login.html';
    }

    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    });

     document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
     
     // Menu toggle for mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (window.innerWidth <= 1024) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    let currentUserId = null;
    let currentUserName = null;
    let allUsers = [];
    let conversations = [];


    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);

    // Close sidebar on window resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 1024) {
        closeSidebar();
      }
    });

    // Load conversations
    async function loadConversations() {
      try {
        const data = await API.message.getConversations();
        conversations = data.conversations || [];
        renderConversations();
        updateTotalUnread();
      } catch (error) {
        console.error('Error loading conversations:', error);
      }
    }

    // Render conversations list
    function renderConversations() {
      const container = document.getElementById('conversationsList');
      
      if (!conversations || conversations.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding: 2rem 1rem;">
            <i class="fas fa-inbox" style="font-size: 2rem; color: var(--gray); margin-bottom: 0.5rem;"></i>
            <p style="color: var(--gray); font-size: 0.875rem;">No conversations yet</p>
            <p style="color: var(--gray); font-size: 0.75rem; margin-top: 0.5rem;">Click "New Chat" to start</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = conversations.map(c => {
        const userId = c._id?._id || c._id;
        const userName = c._id?.name || 'User';
        const isActive = currentUserId === userId;
        const hasUnread = c.unreadCount > 0;
        
        return `
          <div class="conversation-item ${isActive ? 'active' : ''} ${hasUnread ? 'unread' : ''}" 
               onclick="selectConversation('${userId}', '${userName}')">
            <div class="conversation-header">
              <span class="conversation-name">${userName}</span>
              <span class="conversation-time">${formatTime(c.lastMessageAt)}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <div class="conversation-preview" style="flex: 1;">${c.lastMessage || 'No messages yet'}</div>
              ${hasUnread ? `<span class="conversation-badge">${c.unreadCount}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Select a conversation
    async function selectConversation(userId, userName) {
      currentUserId = userId;
      currentUserName = userName;
      
      // Update UI
      document.getElementById('chatTitle').innerHTML = `
        <i class="fas fa-user" style="color: var(--primary); margin-right: 0.5rem;"></i>
        ${userName}
      `;
      document.getElementById('currentUserId').value = userId;
      document.getElementById('chatInputContainer').style.display = 'flex';
      document.getElementById('chatActions').style.display = 'flex';
      
      // Re-render conversations to show active state
      renderConversations();
      
      // Load messages
      await loadMessages();
    }

    // Load messages for selected user
    async function loadMessages() {
      if (!currentUserId) return;
      
      try {
        const data = await API.message.getMessages(currentUserId);
        const container = document.getElementById('chatMessages');
        
        if (!data.messages || data.messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="padding: 3rem;">
              <div class="empty-state-icon">
                <i class="fas fa-comment-dots"></i>
              </div>
              <h3>No Messages Yet</h3>
              <p>Start the conversation by sending a message</p>
            </div>
          `;
          return;
        }
        
        container.innerHTML = data.messages.map(msg => `
          <div class="chat-message ${msg.sender === 'admin' ? 'sent' : 'received'}">
            <div>${escapeHtml(msg.message)}</div>
            <div class="chat-message-time">${API.utils.formatDateTime(msg.createdAt)}</div>
          </div>
        `).join('');
        
        container.scrollTop = container.scrollHeight;
        
        // Refresh conversations to update unread counts
        loadConversations();
      } catch (error) {
        console.error('Error loading messages:', error);
      }
    }

    // Send message
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      const userId = document.getElementById('currentUserId').value;
      
      if (!message || !userId) return;
      
      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      
      try {
        await API.message.send({ message, userId });
        input.value = '';
        await loadMessages();
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    // Refresh messages
    async function refreshMessages() {
      if (currentUserId) {
        await loadMessages();
      }
    }

    // Open new chat modal
    async function openNewChatModal() {
      document.getElementById('newChatModal').style.display = 'flex';
      document.getElementById('userSearchInput').value = '';
      document.getElementById('userSearchInput').focus();
      await loadAllUsers();
    }

    // Close new chat modal
    function closeNewChatModal() {
      document.getElementById('newChatModal').style.display = 'none';
    }

    // Load all users for new chat
    async function loadAllUsers() {
      const container = document.getElementById('userSearchResults');
      container.innerHTML = `
        <div class="loading" style="padding: 2rem;">
          <div class="spinner" style="width: 30px; height: 30px;"></div>
        </div>
      `;
      
      try {
        // Use the admin/users endpoint with limit
        const data = await API.admin.getUsers('', '', 1, 100);
        allUsers = data.users || [];
        renderUserSearchResults(allUsers);
      } catch (error) {
        console.error('Error loading users:', error);
        container.innerHTML = `
          <div class="empty-state" style="padding: 2rem;">
            <i class="fas fa-exclamation-circle" style="font-size: 2rem; color: var(--danger); margin-bottom: 0.5rem;"></i>
            <p style="color: var(--gray);">Failed to load users</p>
          </div>
        `;
      }
    }

    // Render user search results
    function renderUserSearchResults(users) {
      const container = document.getElementById('userSearchResults');
      
      if (users.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding: 2rem;">
            <i class="fas fa-search" style="font-size: 2rem; color: var(--gray); margin-bottom: 0.5rem;"></i>
            <p style="color: var(--gray);">No users found</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = users.map(user => {
        const hasConversation = conversations.some(c => (c._id?._id || c._id) === user._id);
        const unreadCount = conversations.find(c => (c._id?._id || c._id) === user._id)?.unreadCount || 0;
        
        return `
          <div class="user-search-item" onclick="startChat('${user._id}', '${user.name}')">
            <div class="user-search-avatar">${user.name.charAt(0).toUpperCase()}</div>
            <div class="user-search-info">
              <div class="user-search-name">${user.name}</div>
              <div class="user-search-email">${user.email}</div>
            </div>
            ${unreadCount > 0 ? `<span class="user-search-unread">${unreadCount}</span>` : ''}
            ${hasConversation ? '<i class="fas fa-check-circle" style="color: var(--secondary);"></i>' : ''}
          </div>
        `;
      }).join('');
    }

    // Search users
    function searchUsers(query) {
      const lowerQuery = query.toLowerCase();
      const filtered = allUsers.filter(user => 
        user.name.toLowerCase().includes(lowerQuery) || 
        user.email.toLowerCase().includes(lowerQuery)
      );
      renderUserSearchResults(filtered);
    }

    // Start chat with user
    async function startChat(userId, userName) {
      closeNewChatModal();
      await selectConversation(userId, userName);
    }

    // Update total unread badge
    function updateTotalUnread() {
      const totalUnread = conversations.reduce((sum, c) => sum + (c.unreadCount || 0), 0);
      const badge = document.getElementById('totalUnreadBadge');
      const btn = document.getElementById('messageBadgeBtn');
      
      if (totalUnread > 0) {
        badge.textContent = totalUnread > 99 ? '99+' : totalUnread;
        btn.style.display = 'flex';
      } else {
        btn.style.display = 'none';
      }
    }

    // Format relative time
    function formatTime(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 60) return 'Just now';
      if (minutes < 60) return `${minutes}m`;
      if (hours < 24) return `${hours}h`;
      if (days < 7) return `${days}d`;
      return API.utils.formatDate(dateString);
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // Close modal on overlay click
    document.getElementById('newChatModal').addEventListener('click', function(e) {
      if (e.target === this) closeNewChatModal();
    });

    // Poll conversations every 5 seconds for more responsiveness
    setInterval(loadConversations, 5000);

    // Initial load
    loadConversations();
  </script>
</body>
</html>
