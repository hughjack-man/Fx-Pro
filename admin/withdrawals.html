<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <title>Withdrawals - Fx Pro Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-coins"></i></div>
        <span class="sidebar-brand">Fx Pro Admin</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Admin</div>
          <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
          <a href="users.html" class="nav-item"><i class="fas fa-users"></i><span>Users</span></a>
          <a href="deposits.html" class="nav-item"><i class="fas fa-arrow-down"></i><span>Deposits</span></a>
          <a href="withdrawals.html" class="nav-item active"><i class="fas fa-arrow-up"></i><span>Withdrawals</span></a>
          <a href="investments.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Investments</span></a>
          <a href="investment-plans.html" class="nav-item"><i class="fas fa-gem"></i><span>Plans</span></a>
          <a href="loans.html" class="nav-item"><i class="fas fa-hand-holding-usd"></i><span>Loans</span></a>
          <a href="kyc.html" class="nav-item"><i class="fas fa-id-card"></i><span>KYC</span></a>
          <a href="messages.html" class="nav-item"><i class="fas fa-envelope"></i><span>Messages</span></a>
          <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
          <a href="logs.html" class="nav-item"><i class="fas fa-history"></i><span>Logs</span></a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">Manage Withdrawals</h1>
        </div>
        <div class="header-right">
          <!-- <button class="header-btn" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></button> -->
          <div class="user-menu">
            <div class="user-avatar">A</div>
            <div class="user-info">
              <div class="user-name">Admin</div>
              <div class="user-role">Administrator</div>
            </div>
          </div>
        </div>
      </header>

      <div class="content">
        <div id="alertContainer"></div>
        
        <div class="card" style="width: 32rem;">
          <div class="card-header">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
              <select class="form-select" id="statusFilter" style="width: 150px;" onchange="loadWithdrawals()">
                <option value="">All Status</option>
                <option value="pending" selected>Pending</option>
                <option value="approved">Approved</option>
                <option value="declined">Declined</option>
              </select>
              <button class="btn btn-primary" onclick="loadWithdrawals()">
                <i class="fas fa-sync"></i><span>Refresh</span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <div id="withdrawalsList"><div class="loading"><div class="spinner"></div></div></div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Decline Modal -->
  <div class="modal-overlay" id="declineModal" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Decline Withdrawal</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="declineWithdrawalId">
        <div class="form-group">
          <label class="form-label">Reason (Optional)</label>
          <textarea class="form-textarea" id="declineReason" placeholder="Enter reason for declining..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDecline()">Decline Withdrawal</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notification.js"></script>
  <script>
    if (!API.utils.isAuthenticated() || !API.utils.isAdmin()) {
      window.location.href = '../user/login.html';
    }

    // Menu toggle for mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (window.innerWidth <= 1024) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);

    // Close sidebar on window resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 1024) {
        closeSidebar();
      }
    });

    let currentPage = 1;

    async function loadWithdrawals(page = 1) {
      try {
        const status = document.getElementById('statusFilter').value;
        const data = await API.withdrawal.getAll(status, page, 20);
        
        const container = document.getElementById('withdrawalsList');
        if (!data.withdrawals || data.withdrawals.length === 0) {
          container.innerHTML = `<div class="empty-state"><p>No withdrawals found</p></div>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }
        
        container.innerHTML = `
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Amount</th>
                  <th>Method</th>
                  <th>Destination</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.withdrawals.map(w => `
                  <tr>
                    <td>${w.userId?.name || 'User'}<br><small style="color: var(--gray);">${w.userId?.email || ''}</small></td>
                    <td style="font-weight: 600;">${API.utils.formatCurrency(w.amount)}</td>
                    <td>${w.type.toUpperCase()}</td>
                    <td style="font-family: monospace; font-size: 0.8rem;">
                      ${w.type === 'btc' ? (w.walletAddress ? w.walletAddress.substring(0, 20) + '...' : '-') : (w.bankDetails?.accountNumber || '-')}
                    </td>
                    <td><span class="badge badge-${w.status === 'approved' ? 'success' : w.status === 'pending' ? 'warning' : 'danger'}">${w.status}</span></td>
                    <td>${API.utils.formatDateTime(w.createdAt)}</td>
                    <td>
                      ${w.status === 'pending' ? `
                        <button class="btn btn-sm btn-success" onclick="approveWithdrawal('${w._id}')">
                          <i class="fas fa-check"></i> Approve
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="openDeclineModal('${w._id}')">
                          <i class="fas fa-times"></i> Decline
                        </button>
                      ` : '<span>-</span>'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
        
        const pagination = document.getElementById('pagination');
        if (data.pagination.pages > 1) {
          let html = `<button class="pagination-btn" ${page === 1 ? 'disabled' : ''} onclick="loadWithdrawals(${page - 1})"><i class="fas fa-chevron-left"></i></button>`;
          for (let i = 1; i <= data.pagination.pages; i++) {
            html += `<button class="pagination-btn ${i === page ? 'active' : ''}" onclick="loadWithdrawals(${i})">${i}</button>`;
          }
          html += `<button class="pagination-btn" ${page === data.pagination.pages ? 'disabled' : ''} onclick="loadWithdrawals(${page + 1})"><i class="fas fa-chevron-right"></i></button>`;
          pagination.innerHTML = html;
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    async function approveWithdrawal(id) {
      if (!confirm('Are you sure you want to approve this withdrawal?')) return;
      
      try {
        await API.withdrawal.approve(id);
        API.utils.showAlert('Withdrawal approved successfully', 'success');
        loadWithdrawals(currentPage);
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    function openDeclineModal(id) {
      document.getElementById('declineWithdrawalId').value = id;
      document.getElementById('declineModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('declineModal').style.display = 'none';
      document.getElementById('declineReason').value = '';
    }

    async function confirmDecline() {
      const id = document.getElementById('declineWithdrawalId').value;
      const reason = document.getElementById('declineReason').value;
      
      try {
        await API.withdrawal.decline(id, reason);
        API.utils.showAlert('Withdrawal declined', 'success');
        closeModal();
        loadWithdrawals(currentPage);
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      }
    }

    loadWithdrawals();
  </script>
</body>
</html>
