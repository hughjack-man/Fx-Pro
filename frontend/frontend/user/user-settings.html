<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Coinnex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-coins"></i></div>
        <span class="sidebar-brand">Coinnex</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
          <a href="deposit.html" class="nav-item"><i class="fas fa-arrow-down"></i><span>Deposit</span></a>
          <a href="withdraw.html" class="nav-item"><i class="fas fa-arrow-up"></i><span>Withdraw</span></a>
          <a href="invest.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Invest</span></a>
          <a href="loans.html" class="nav-item"><i class="fas fa-hand-holding-usd"></i><span>Loans</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <a href="transactions.html" class="nav-item"><i class="fas fa-list"></i><span>Transactions</span></a>
          <a href="referrals.html" class="nav-item"><i class="fas fa-users"></i><span>Referrals</span></a>
          <a href="kyc.html" class="nav-item"><i class="fas fa-id-card"></i><span>KYC</span></a>
          <a href="wallet-settings.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
          <a href="support.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
          <a href="user-settings.html" class="nav-item active"><i class="fas fa-cog"></i><span>Settings</span></a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
          <h1 class="page-title">Account Settings</h1>
        </div>
        <div class="header-right">
          <button class="header-btn" onclick="API.auth.logout()"><i class="fas fa-sign-out-alt"></i></button>
          <div class="user-menu">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-info">
              <div class="user-name" id="userName">User</div>
              <div class="user-role">Investor</div>
            </div>
          </div>
        </div>
      </header>

      <div class="content">
        <div id="alertContainer"></div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem;">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title"><i class="fas fa-user" style="color: var(--primary); margin-right: 0.5rem;"></i>Profile Information</h3>
            </div>
            <div class="card-body">
              <form id="profileForm">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-input" id="fullName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-input" id="email" readonly style="background: rgba(100, 116, 139, 0.1);">
                  <p class="form-hint">Email cannot be changed</p>
                </div>
                <div class="form-group">
                  <label class="form-label">Referral Code</label>
                  <input type="text" class="form-input" id="referralCode" readonly style="background: rgba(100, 116, 139, 0.1); font-family: monospace; letter-spacing: 2px;">
                </div>
                <button type="submit" class="btn btn-primary" id="saveProfileBtn">
                  <i class="fas fa-save"></i><span>Save Changes</span>
                </button>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title"><i class="fas fa-lock" style="color: var(--warning); margin-right: 0.5rem;"></i>Change Password</h3>
            </div>
            <div class="card-body">
              <form id="passwordForm">
                <div class="form-group">
                  <label class="form-label">Current Password</label>
                  <input type="password" class="form-input" id="currentPassword" placeholder="Enter current password">
                </div>
                <div class="form-group">
                  <label class="form-label">New Password</label>
                  <input type="password" class="form-input" id="newPassword" placeholder="Enter new password">
                </div>
                <div class="form-group">
                  <label class="form-label">Confirm New Password</label>
                  <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm new password">
                </div>
                <button type="submit" class="btn btn-warning" id="changePasswordBtn">
                  <i class="fas fa-key"></i><span>Change Password</span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="card" style="border-color: rgba(239, 68, 68, 0.3);">
          <div class="card-header">
            <h3 class="card-title" style="color: var(--danger);"><i class="fas fa-exclamation-triangle" style="margin-right: 0.5rem;"></i>Danger Zone</h3>
          </div>
          <div class="card-body">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
              <div>
                <div style="font-weight: 600; margin-bottom: 0.25rem;">Logout from all devices</div>
                <div style="color: var(--gray); font-size: 0.875rem;">This will end all your active sessions</div>
              </div>
              <button class="btn btn-danger" onclick="API.auth.logout()">
                <i class="fas fa-sign-out-alt"></i><span>Logout</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notification.js"></script>
  <script src="../js/tawkto.js"></script>
  <script>
    if (!API.utils.isAuthenticated()) window.location.href = 'login.html';
    
    // Menu toggle for mobile
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      if (window.innerWidth <= 1024) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('menuToggle').addEventListener('click', toggleSidebar);

    // Close sidebar on window resize to desktop
    window.addEventListener('resize', () => {
      if (window.innerWidth > 1024) {
        closeSidebar();
      }
    });

    async function loadData() {
      try {
        const userData = await API.user.getDashboard();
        document.getElementById('userName').textContent = userData.user.name;
        document.getElementById('userAvatar').textContent = userData.user.name.charAt(0).toUpperCase();
        
        const profile = await API.user.getProfile();
        const user = profile.user;
        
        document.getElementById('fullName').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('referralCode').value = user.referralCode;
      } catch (error) {
        console.error('Error:', error);
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('saveProfileBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></div>';
      
      try {
        await API.user.updateProfile({ name: document.getElementById('fullName').value });
        API.utils.showAlert('Profile updated successfully!', 'success');
      } catch (error) {
        API.utils.showAlert(error.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i><span>Save Changes</span>';
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword !== confirmPassword) {
        API.utils.showAlert('Passwords do not match', 'warning');
        return;
      }
      if (newPassword.length < 6) {
        API.utils.showAlert('Password must be at least 6 characters', 'warning');
        return;
      }
      
      const btn = document.getElementById('changePasswordBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></div>';
      
      // Note: Password change endpoint would need to be added to backend
      API.utils.showAlert('Password change feature coming soon', 'info');
      
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-key"></i><span>Change Password</span>';
    });

    loadData();

    // Load unread message count
    async function loadUnreadMessageCount() {
      try {
        const data = await API.message.getUnreadCount();
        const badge = document.getElementById('messageBadge');
        if (data.count > 0) {
          badge.textContent = data.count > 99 ? '99+' : data.count;
          badge.style.display = 'block';
        } else {
          badge.style.display = 'none';
        }
      } catch (error) {
        console.error('Error loading unread count:', error);
      }
    }

    loadUnreadMessageCount();
    loadUnreadMessageCount();

    // Poll unread messages every 10 seconds
    setInterval(loadUnreadMessageCount, 10000);
  </script>

</body>
</html>
