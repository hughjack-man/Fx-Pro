<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Coinnex</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <i class="fas fa-coins"></i>
          </div>
          <h1>Create Account</h1>
          <p>Join Coinnex and start investing</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <form id="registerForm">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <div style="position: relative;">
              <i class="fas fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
              <input type="text" class="form-input" id="name" placeholder="Enter your full name" required style="padding-left: 2.75rem;">
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <div style="position: relative;">
              <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
              <input type="email" class="form-input" id="email" placeholder="Enter your email" required style="padding-left: 2.75rem;">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <div style="position: relative;">
              <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
              <input type="number" class="form-input" id="number" placeholder="Phone number" required style="padding-left: 2.75rem;">
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Password *</label>
            <div style="position: relative;">
              <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
              <input type="password" class="form-input" id="password" placeholder="Create a password" required style="padding-left: 2.75rem;">
              <button type="button" id="togglePassword" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer;">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <p class="form-hint">Password must be at least 6 characters</p>
          </div>
          
          <div class="form-group">
            <label class="form-label">Referral Code (Optional)</label>
            <div style="position: relative;">
              <i class="fas fa-gift" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
              <input type="text" class="form-input" id="referralCode" placeholder="Referral code $50" style="padding-left: 2.75rem; text-transform: uppercase;">
            </div>
          </div>
          
          <div style="margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="terms" required style="width: 16px; height: 16px; margin-top: 3px;">
              <span style="font-size: 0.875rem; color: #94a3b8;">
                I agree to the <a href="#" style="color: #818cf8;">Terms of Service</a> and 
                <a href="#" style="color: #818cf8;">Privacy Policy</a>
              </span>
            </label>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
            <i class="fas fa-user-plus"></i>
            <span>Create Account</span>
          </button>
        </form>
        
        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
        
        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="../index.html" style="color: #64748b; font-size: 0.875rem;">
            <i class="fas fa-arrow-left"></i> Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Check if already logged in
    (function() {
      try {
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        
        if (token && userStr) {
          const user = JSON.parse(userStr);
          if (user.role === 'admin') {
            window.location.href = '../admin/dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }
      } catch (e) {
        console.error('Auth check error:', e);
        localStorage.removeItem('token');
        localStorage.removeItem('user');
      }
    })();

    // Get referral code from URL
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
      document.getElementById('referralCode').value = refCode.toUpperCase();
    }

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Handle register form
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const referralCode = document.getElementById('referralCode').value.trim();
      const registerBtn = document.getElementById('registerBtn');
      
      // Validate password
      if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }
      
      // Show loading
      registerBtn.disabled = true;
      registerBtn.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; border-width: 2px;"></div> Creating account...';
      
      try {
        const userData = { name, email, password };
        if (referralCode) {
          userData.referralCode = referralCode.toUpperCase();
        }
        
        // Make direct fetch call for better error handling
        // const API_BASE_URL = window.location.port === '5000' || window.location.port === '' 
        //   ? `${window.location.origin}/api` 
        //   : 'https://coinnex-backend.onrender.com/api';

        // REPLACE THIS SECTION:
// const API_BASE_URL = window.location.port === '5000' || window.location.port === '' 
//   ? `${window.location.origin}/api` 
//   : 'https://coinnex-backend.onrender.com/api';

// WITH THIS:
const API_BASE_URL = 'https://coinnex-backend.onrender.com/api';
          
        const response = await fetch(`${API_BASE_URL}/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(userData)
        });
        
        const responseText = await response.text();
        
        let data;
        try {
          data = JSON.parse(responseText);
        } catch (e) {
          throw new Error('Server returned invalid response. Please make sure the backend is running on port 5000.');
        }
        
        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Registration failed');
        }
        
        // Store token and user
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // Show success message
        showSuccess('Account created successfully! Redirecting...');
        
        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
        
      } catch (error) {
        console.error('Register error:', error);
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="fas fa-user-plus"></i><span>Create Account</span>';
        showError(error.message || 'An error occurred. Please try again.');
      }
    });
    
    function showError(message) {
      const alertContainer = document.getElementById('alertContainer');
      const alertDiv = document.createElement('div');
      alertDiv.className = 'alert alert-danger fade-in';
      alertDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i><span>${message}</span>`;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alertDiv);
    }
    
    function showSuccess(message) {
      const alertContainer = document.getElementById('alertContainer');
      const alertDiv = document.createElement('div');
      alertDiv.className = 'alert alert-success fade-in';
      alertDiv.innerHTML = `<i class="fas fa-check-circle"></i><span>${message}</span>`;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alertDiv);
    }
  </script>

</html>
